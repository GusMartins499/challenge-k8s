apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-k8s

spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  replicas: 1
  selector:
    matchLabels:
      app: postgres-k8s
  template:
    metadata:
      labels:
        app: postgres-k8s
    spec:
      containers:
        - name: postgres-k8s
          image: postgres:16
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-k8s-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres-k8s
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-k8s-volume
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-k8s-volume
          persistentVolumeClaim:
            claimName: postgres-k8s-pvc
